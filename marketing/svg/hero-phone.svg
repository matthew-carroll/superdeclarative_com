<svg viewBox="0 0 200 408" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto">
<defs>
  <!-- Titanium outer frame gradient -->
  <linearGradient id="phoneFrameGrad" x1="0" y1="0" x2="200" y2="408" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#63636E" />
    <stop offset="25%" stop-color="#2E2E34" />
    <stop offset="50%" stop-color="#484852" />
    <stop offset="80%" stop-color="#1C1C21" />
    <stop offset="100%" stop-color="#111114" />
  </linearGradient>
  <!-- Screen background gradient -->
  <linearGradient id="phoneScreenGrad" x1="100" y1="12" x2="100" y2="396" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#1E1E24" />
    <stop offset="55%" stop-color="#141418" />
    <stop offset="100%" stop-color="#09090B" />
  </linearGradient>
  <!-- Hero visualizer stage gradient -->
  <radialGradient id="phoneStageGlow" cx="50%" cy="45%" r="60%">
    <stop offset="0%" stop-color="#52525B" stop-opacity="0.7" />
    <stop offset="60%" stop-color="#27272A" stop-opacity="0.4" />
    <stop offset="100%" stop-color="#18181B" stop-opacity="0.95" />
  </radialGradient>
  <!-- App card surface gradient -->
  <linearGradient id="phoneCardGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2E2E36" />
    <stop offset="100%" stop-color="#1B1B21" />
  </linearGradient>
  <!-- Screen glass diagonal sheen -->
  <linearGradient id="phoneGlassSheen" x1="0" y1="0" x2="200" y2="280" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.11" />
    <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.03" />
    <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" />
  </linearGradient>
  <!-- Bottom 30% fade to black gradient (from y=70% to y=100%) -->
  <linearGradient id="phoneBottomBlackFade" x1="100" y1="275" x2="100" y2="408" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#000000" stop-opacity="0" />
    <stop offset="45%" stop-color="#050507" stop-opacity="0.65" />
    <stop offset="80%" stop-color="#050507" stop-opacity="0.96" />
    <stop offset="100%" stop-color="#000000" stop-opacity="1" />
  </linearGradient>
  <clipPath id="phoneOuterClip">
    <rect x="1.5" y="4" width="197" height="400" rx="36" />
  </clipPath>
  <clipPath id="phoneScreenClip">
    <rect x="11" y="11" width="178" height="386" rx="29" />
  </clipPath>
</defs>

<g>
  <!-- Side hardware buttons -->
  <rect x="1.5" y="82" width="3" height="22" rx="1.5" fill="#484852" />
  <rect x="1.5" y="118" width="3" height="34" rx="1.5" fill="#484852" />
  <rect x="1.5" y="162" width="3" height="34" rx="1.5" fill="#484852" />
  <rect x="195.5" y="130" width="3" height="52" rx="1.5" fill="#484852" />

  <!-- Outer Titanium Chassis -->
  <rect x="4" y="4" width="192" height="400" rx="36" fill="url(#phoneFrameGrad)" stroke="#71717A" stroke-width="1.5" />
  <!-- Inner Bezel -->
  <rect x="7" y="7" width="186" height="394" rx="33" fill="#09090B" />

  <!-- App Screen Content -->
  <g clip-path="url(#phoneScreenClip)">
    <rect x="11" y="11" width="178" height="386" fill="url(#phoneScreenGrad)" />

    <!-- Top Status Bar -->
    <rect x="26" y="23" width="22" height="5" rx="2.5" fill="#D4D4D8" opacity="0.8" />
    <!-- Signal bars + Battery -->
    <rect x="145" y="25" width="2.5" height="4" rx="1" fill="#D4D4D8" />
    <rect x="149" y="23.5" width="2.5" height="5.5" rx="1" fill="#D4D4D8" />
    <rect x="153" y="22" width="2.5" height="7" rx="1" fill="#D4D4D8" />
    <rect x="160" y="22.5" width="14" height="6.5" rx="2" stroke="#D4D4D8" stroke-width="1" />
    <rect x="162" y="24" width="9" height="3.5" rx="1" fill="#FAFAFA" />

    <!-- App Header Bar: Facepile + Segmented Pill + Action Button -->
    <circle cx="31" cy="54" r="9" fill="#3F3F46" stroke="#A1A1AA" stroke-width="1.2" />
    <circle cx="43" cy="54" r="9" fill="#52525B" stroke="#E4E4E7" stroke-width="1.2" />
    <circle cx="55" cy="54" r="9" fill="#71717A" stroke="#FAFAFA" stroke-width="1.2" />
    <rect x="74" y="46" width="68" height="16" rx="8" fill="#27272A" stroke="#3F3F46" stroke-width="1" />
    <rect x="76" y="48" width="34" height="12" rx="6" fill="#E4E4E7" />
    <rect x="152" y="45" width="26" height="18" rx="9" fill="#3F3F46" stroke="#71717A" stroke-width="1" />
    <circle cx="160" cy="54" r="2.5" fill="#FAFAFA" />
    <circle cx="169" cy="54" r="2.5" fill="#A1A1AA" />

    <!-- Featured 3D Spatial / Synth Visualizer Card -->
    <rect x="20" y="72" width="160" height="114" rx="16" fill="url(#phoneStageGlow)" stroke="#63636E" stroke-width="1.2" />
    <!-- Perspective grid lines inside stage -->
    <path d="M 20 156 L 180 156 M 20 168 L 180 168 M 28 146 L 172 146" stroke="#71717A" stroke-width="0.6" stroke-opacity="0.45" />
    <path d="M 100 132 L 32 184 M 100 132 L 66 184 M 100 132 L 100 184 M 100 132 L 134 184 M 100 132 L 168 184" stroke="#71717A" stroke-width="0.6" stroke-opacity="0.4" />

    <!-- 3D Wireframe Sphere / Nested Orbitals in Hero Card -->
    <ellipse cx="100" cy="122" rx="46" ry="14" stroke="#A1A1AA" stroke-width="1.2" stroke-dasharray="3 2" />
    <ellipse cx="100" cy="122" rx="32" ry="26" stroke="#D4D4D8" stroke-width="1.3" transform="rotate(-24 100 122)" />
    <ellipse cx="100" cy="122" rx="32" ry="26" stroke="#E4E4E7" stroke-width="1.3" transform="rotate(24 100 122)" />
    <circle cx="100" cy="122" r="14" fill="#FAFAFA" fill-opacity="0.18" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="100" cy="122" r="5.5" fill="#FFFFFF" />
    <!-- Orbiting satellites on the 3D visualizer -->
    <circle cx="56" cy="118" r="3.5" fill="#FAFAFA" />
    <circle cx="144" cy="126" r="4" fill="#FFFFFF" />
    <circle cx="118" cy="99" r="3" fill="#D4D4D8" />

    <!-- Top overlay chips inside Hero Card -->
    <rect x="28" y="80" width="46" height="14" rx="7" fill="#18181B" fill-opacity="0.8" stroke="#52525B" stroke-width="0.8" />
    <circle cx="36" cy="87" r="2.8" fill="#FAFAFA" />
    <rect x="42" y="85" width="24" height="4" rx="2" fill="#E4E4E7" />
    <!-- Audio / Telemetry Equalizer Bars at bottom of Hero Card -->
    <g fill="#FAFAFA" opacity="0.9">
      <rect x="34" y="166" width="3" height="10" rx="1.5" />
      <rect x="40" y="160" width="3" height="16" rx="1.5" />
      <rect x="46" y="154" width="3" height="22" rx="1.5" />
      <rect x="52" y="162" width="3" height="14" rx="1.5" />
      <rect x="58" y="150" width="3" height="26" rx="1.5" />
      <rect x="64" y="157" width="3" height="19" rx="1.5" />
      <rect x="70" y="164" width="3" height="12" rx="1.5" />
      <rect x="134" y="161" width="36" height="12" rx="6" fill="#FAFAFA" />
      <path d="M 149 164 L 156 167 L 149 170 Z" fill="#18181B" />
    </g>

    <!-- Bento Row: Multi-Ring Radial Dial (Left) + Candlestick Chart (Right) -->
    <rect x="20" y="194" width="76" height="82" rx="14" fill="url(#phoneCardGrad)" stroke="#52525B" stroke-width="1" />
    <!-- Concentric Activity Rings -->
    <circle cx="58" cy="230" r="22" stroke="#27272A" stroke-width="4.5" />
    <path d="M 58 208 A 22 22 0 1 1 37 237" stroke="#FAFAFA" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="58" cy="230" r="15" stroke="#27272A" stroke-width="4" />
    <path d="M 58 215 A 15 15 0 1 1 45 238" stroke="#D4D4D8" stroke-width="4" stroke-linecap="round" />
    <circle cx="58" cy="230" r="8.5" stroke="#27272A" stroke-width="3.5" />
    <path d="M 58 221.5 A 8.5 8.5 0 1 1 50 233" stroke="#A1A1AA" stroke-width="3.5" stroke-linecap="round" />
    <rect x="36" y="262" width="44" height="5" rx="2.5" fill="#D4D4D8" />

    <!-- Right Bento: Candlestick & Trend Chart -->
    <rect x="104" y="194" width="76" height="82" rx="14" fill="url(#phoneCardGrad)" stroke="#52525B" stroke-width="1" />
    <rect x="114" y="203" width="32" height="5" rx="2.5" fill="#A1A1AA" />
    <rect x="152" y="201" width="18" height="9" rx="4.5" fill="#3F3F46" />
    <!-- Candlesticks -->
    <line x1="118" y1="224" x2="118" y2="254" stroke="#A1A1AA" stroke-width="1.2" />
    <rect x="115" y="232" width="6" height="14" rx="1.5" fill="#A1A1AA" />
    <line x1="130" y1="218" x2="130" y2="248" stroke="#FAFAFA" stroke-width="1.2" />
    <rect x="127" y="222" width="6" height="18" rx="1.5" fill="#FAFAFA" />
    <line x1="142" y1="226" x2="142" y2="256" stroke="#A1A1AA" stroke-width="1.2" />
    <rect x="139" y="234" width="6" height="13" rx="1.5" fill="#71717A" />
    <line x1="154" y1="214" x2="154" y2="244" stroke="#FAFAFA" stroke-width="1.2" />
    <rect x="151" y="218" width="6" height="16" rx="1.5" fill="#E4E4E7" />
    <line x1="166" y1="208" x2="166" y2="238" stroke="#FFFFFF" stroke-width="1.2" />
    <rect x="163" y="211" width="6" height="18" rx="1.5" fill="#FFFFFF" />
    <rect x="114" y="262" width="48" height="5" rx="2.5" fill="#D4D4D8" />

    <!-- Lower Interactive Node / Timeline Card (fades into bottom black gradient) -->
    <rect x="20" y="284" width="160" height="68" rx="14" fill="url(#phoneCardGrad)" stroke="#52525B" stroke-width="1" />
    <path d="M 42 316 C 68 298, 92 334, 118 312 C 136 298, 148 318, 162 306" stroke="#E4E4E7" stroke-width="2" fill="none" />
    <circle cx="42" cy="316" r="4.5" fill="#FAFAFA" />
    <circle cx="80" cy="316" r="4.5" fill="#D4D4D8" />
    <circle cx="118" cy="312" r="4.5" fill="#FAFAFA" />
    <circle cx="162" cy="306" r="4.5" fill="#FFFFFF" />

    <!-- Glass Reflection Sheen -->
    <rect x="11" y="11" width="178" height="386" fill="url(#phoneGlassSheen)" />
  </g>

  <!-- Dynamic Island Cutout -->
  <rect x="68" y="18" width="64" height="17" rx="8.5" fill="#050507" />
  <circle cx="121" cy="26.5" r="3.2" fill="#181824" />
  <circle cx="122" cy="25.5" r="1" fill="#52525B" />
</g>
</svg>
