name: Build and deploy website
on:
  push:
    branches:
      main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      # Checkout the repository
      - uses: actions/checkout@v7

      # Setup a Dart environment. Jaspr 0.23's build packages don't support Dart 3.14 yet.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13"

      # Download all the packages that the app uses
      - run: dart pub get

      - name: Make tailwind executable
        run: chmod +x tailwindcss

      # Build the static site
      - run: ./tool/build.sh

      # Don't deploy an unstyled site.
      - name: Check that the stylesheet was built
        run: test -s build/jaspr/styles/tailwind.css

      # Zip and upload the static site.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/jaspr

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
