name: Build and deploy website
on:
  push:
    branches:
      main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      # Checkout the repository
      - uses: actions/checkout@v7

      # Setup a Dart environment
      - uses: dart-lang/setup-dart@v1

      # Download all the packages that the app uses
      - run: dart pub get
        working-directory: marketing

      - name: Make tailwind executable
        run: chmod +x tailwindcss
        working-directory: marketing

      # Build the static site
      - run: dart run bin/super_declarative_com.dart
        working-directory: marketing
        env:
          GHUB_DOC_WEBSITE_TOKEN: ${{ vars.GHUB_DOC_WEBSITE_TOKEN }}

      # The site build only warns when Tailwind fails, which would deploy an unstyled site.
      - name: Check that the stylesheet was built
        run: test -s build/styles/tailwind.css
        working-directory: marketing

      # Zip and upload the static site.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./marketing/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
